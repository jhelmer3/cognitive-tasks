    <title>FPT Battery</title>

<script>
    const { BayesianUpdate, DenominatorNeglect, TimeSeries } = initFPTBattery.tasks;
    
    // ── BayesianUpdate subclass ───────────────────────────────────────────────
    class TrimmedBayesianUpdate extends BayesianUpdate {
        constructor(name, media_basepath, jsPsych, custom_task_settings) {
            const dropSpecs = custom_task_settings.drop_unique_trials_with_ball_splits || [];
            const { drop_unique_trials_with_ball_splits, ...clean_settings } = custom_task_settings;
            super(name, media_basepath, jsPsych, clean_settings);
            if (dropSpecs.length > 0) {
                this._drop_unique_trials(dropSpecs);
            }
            this._log_ball_split_distribution();
        }

        _log_ball_split_distribution() {
            const seenUnique = new Set();
            const countsBySplit = {};
            for (const blockKey of Object.keys(this.task_data.test_trials)) {
                for (const trialKey of Object.keys(this.task_data.test_trials[blockKey])) {
                    const t = this.task_data.test_trials[blockKey][trialKey];
                    if (seenUnique.has(t.unique_trial)) continue;
                    seenUnique.add(t.unique_trial);
                    const key = `[${t.ball_split[0]}, ${t.ball_split[1]}]`;
                    countsBySplit[key] = (countsBySplit[key] || 0) + 1;
                }
            }
            console.log(
                `%c[BayesianUpdate] final test-trial ball_split distribution (unique trials):`,
                'font-weight: bold; color: #0a7; font-size: 13px;',
                countsBySplit,
                `(total unique = ${seenUnique.size}, total draws = ${this.settings.test_trials_n})`
            );
        }

        _drop_unique_trials(dropSpecs) {
            const blockKeys = Object.keys(this.task_data.test_trials).sort();

            const dropUniqueTrialIndices = new Set();
            for (const drop of dropSpecs) {
                let matched = false;
                for (const blockKey of blockKeys) {
                    for (const trialKey of Object.keys(this.task_data.test_trials[blockKey])) {
                        const t = this.task_data.test_trials[blockKey][trialKey];
                        if (dropUniqueTrialIndices.has(t.unique_trial)) continue;
                        if (t.ball_split[0] === drop[0] && t.ball_split[1] === drop[1]) {
                            dropUniqueTrialIndices.add(t.unique_trial);
                            matched = true;
                            break;
                        }
                    }
                    if (matched) break;
                }
                if (!matched) {
                    console.warn(
                        `[TrimmedBayesianUpdate] No unmatched unique trial with ball_split [${drop}] found to drop.`
                    );
                }
            }

            for (const blockKey of blockKeys) {
                for (const trialKey of Object.keys(this.task_data.test_trials[blockKey])) {
                    if (dropUniqueTrialIndices.has(this.task_data.test_trials[blockKey][trialKey].unique_trial)) {
                        delete this.task_data.test_trials[blockKey][trialKey];
                    }
                }
            }

            let newTrialInd = 0;
            const oldToNewUnique = new Map();
            let nextNewUnique = 0;
            for (const blockKey of blockKeys) {
                for (const trialKey of Object.keys(this.task_data.test_trials[blockKey])) {
                    const t = this.task_data.test_trials[blockKey][trialKey];
                    t.trial = newTrialInd++;
                    if (!oldToNewUnique.has(t.unique_trial)) {
                        oldToNewUnique.set(t.unique_trial, nextNewUnique++);
                    }
                    t.unique_trial = oldToNewUnique.get(t.unique_trial);
                }
            }
            this.settings.test_trials_n = newTrialInd;
            this.settings.unique_test_trials_n = newTrialInd / this.settings.draws_per_unique_trial;
            const n = this.settings.unique_test_trials_n;
            const setsWord = n === 1 ? 'set' : 'sets';
            this.test_trials_instructions = {
                ...this.test_trials_instructions,
                pages: () => {
                    if (this.settings.task_version === 'easy') {
                        return [
                            `<p class="instructions-title" style="text-align: center">The box and balls task - Predicting the Next Box</p>
                            <p>We will now progress to the test decisions. The task will be broken into ${n} ${setsWord} of ${this.settings.draws_per_unique_trial} decisions. After every set of ${this.settings.draws_per_unique_trial} decisions, the task will reset and you will start from the beginning, with no information about which of the two boxes is the one in the middle.</p>
                            <p>Remember that:</p>
                            <ul>
                                <li>the randomly selected box (represented by the one that has black balls) is one of the two boxes (majority red or majority blue boxes)</li>
                                <li>your task is to decide how likely it is that the randomly selected box is the one with majority blue balls or the one with majority red balls</li>
                                <li>after every draw, the drawn ball is put back into the black box and a new draw occurs; for every draw, the same 100 balls are used</li>
                            </ul>
                            <p>Continue to the test decisions whenever you are ready.</p>`,
                        ];
                    } else {
                        return [
                            `<p class="instructions-title" style="text-align: center">The box and balls task - Predicting the Next Ball</p>
                            <p>We will now progress to the test decisions. The task will be broken into ${n} ${setsWord} of ${this.settings.draws_per_unique_trial} decisions. After every set of ${this.settings.draws_per_unique_trial} decisions, the task will reset and you will start from the beginning, with no information about which of the two boxes is the one in the middle.</p>
                            <p>Remember that:</p>
                            <ul>
                                <li>the randomly selected box (represented by the one that has black balls) is one of the two boxes (majority red or majority blue boxes)</li>
                                <li>your task is to predict the probability that the next ball drawn will be blue</li>
                                <li>after every draw, the drawn ball is put back into the black box and a new draw occurs; for every draw, the same 100 balls are used</li>
                            </ul>
                            <p>Continue to the test decisions whenever you are ready.</p>`,
                        ];
                    }
                },
            };
        }
    }

    // ── DenominatorNeglect subclass ───────────────────────────────────────────
    class FilteredDenominatorNeglect extends DenominatorNeglect {
        constructor(name, media_basepath, jsPsych, custom_task_settings) {
            const keepSpecs = custom_task_settings.keep_only_trials || null;
            const { keep_only_trials, ...clean_settings } = custom_task_settings;
            super(name, media_basepath, jsPsych, clean_settings);
            if (keepSpecs && keepSpecs.length > 0) {
                this._keep_only_trials(keepSpecs);
            }
        }

        _keep_only_trials(keepSpecs) {
            const blockKeys = Object.keys(this.task_data.test_trials).sort();

            const keepKeys = new Set(
                keepSpecs.map(([choice_type, small_prop, diff]) =>
                    `${choice_type}|${small_prop.toFixed(4)}|${diff.toFixed(4)}`
                )
            );

            for (const blockKey of blockKeys) {
                for (const trialKey of Object.keys(this.task_data.test_trials[blockKey])) {
                    const t = this.task_data.test_trials[blockKey][trialKey];

                    const small_prop = t.left_lottery_type === 'small'
                        ? t.left_lottery_gold_prop
                        : t.right_lottery_gold_prop;
                    const large_prop = t.left_lottery_type === 'large'
                        ? t.left_lottery_gold_prop
                        : t.right_lottery_gold_prop;

                    const diff = t.choice_type === 'harmony'
                        ? (large_prop - small_prop).toFixed(4)
                        : (small_prop - large_prop).toFixed(4);

                    const key = `${t.choice_type}|${small_prop.toFixed(4)}|${diff}`;
                    if (!keepKeys.has(key)) {
                        delete this.task_data.test_trials[blockKey][trialKey];
                    }
                }
            }

            let newTrialInd = 0;
            for (const blockKey of blockKeys) {
                for (const trialKey of Object.keys(this.task_data.test_trials[blockKey])) {
                    this.task_data.test_trials[blockKey][trialKey].trial = newTrialInd++;
                }
            }
            this.settings.test_trials_n = newTrialInd;

            console.log(
                `%c[FilteredDenominatorNeglect] kept ${newTrialInd} test trials`,
                'font-weight: bold; color: #0a7; font-size: 13px;'
            );
        }
    }
    
    // ── TimeSeries subclass ───────────────────────────────────────────
    class FilteredTimeSeries extends TimeSeries {
        constructor(name, media_basepath, jsPsych, custom_task_settings) {
            const keepSpecs = custom_task_settings.keep_only_trials || null;
            const { keep_only_trials, ...clean_settings } = custom_task_settings;
            super(name, media_basepath, jsPsych, clean_settings);
            if (keepSpecs && keepSpecs.length > 0) {
                this._keep_only_trials(keepSpecs);
            }
        }

        _keep_only_trials(keepSpecs) {
            const blockKeys = Object.keys(this.task_data.test_trials).sort();
        
            const keepKeys = new Set(
                keepSpecs.map(([func, direction, noise_condition, datapoints]) =>
                    `${func}|${direction}|${noise_condition}|${datapoints}`
                )
            );
        
            for (const blockKey of blockKeys) {
                for (const trialKey of Object.keys(this.task_data.test_trials[blockKey])) {
                    const t = this.task_data.test_trials[blockKey][trialKey];
                    const key = `${t.function}|${t.direction}|${t.noise_condition}|${t.datapoints}`;
                    if (!keepKeys.has(key)) {
                        delete this.task_data.test_trials[blockKey][trialKey];
                    }
                }
            }
        
            let newTrialInd = 0;
            for (const blockKey of blockKeys) {
                for (const trialKey of Object.keys(this.task_data.test_trials[blockKey])) {
                    this.task_data.test_trials[blockKey][trialKey].trial = newTrialInd++;
                }
            }
            this.settings.test_trials_n = newTrialInd;
        
            console.log(
                `%c[FilteredTimeSeries] kept ${newTrialInd} test trials`,
                'font-weight: bold; color: #0a7; font-size: 13px;'
            );
            
            this.test_trials_instructions = {
                ...this.test_trials_instructions,
                pages: [
                    `<p class="instructions-title" style="text-align: center">Predict the next point on the graph</p>
                    <p>You will now progress to the test items. There will be ${newTrialInd} test items.</p>
                    <p>Remember that <b>your task is</b> to figure out the trend based on the existing datapoints, and predict the next six datapoints.</p>
                    `,
                ],
            };
        }
    }

    // ── Shuffle utility for task-level randomization ─────────────────────────
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    const config = {

                    datapoints: ['datapoints_30'],

                    graphs_per_condition: 1,

                    custom_task_settings: {
                        task_version: 'easy',

                        unique_test_trials_n: 8,      // symmetric 4+4, then drop two [40,60] → 2+4
                        draws_per_unique_trial: 5,    // 8 × 5 = 40 total draws pre-drop

                        pt_trials_n: 10,

                        test_trials_per_block: 40,    // 8 × 5 = 40

                        test_trials_n: 36,
                        test_trials_per_block: 36,
                        pt_trials_n: 2,

                        keep_only_trials: [
                            ['conflict', 0.1, 0.08],  // dn.c_1_conflict
                            ['harmony',  0.3, 0.07],  // dn.c_1_harmony
                            ['conflict', 0.2, 0.05],  // dn.c_10_conflict
                            ['harmony',  0.1, 0.06],  // dn.c_10_harmony
                            ['conflict', 0.2, 0.07],  // dn.c_23_conflict
                            ['harmony',  0.3, 0.02],  // dn.c_23_harmony
                            ['conflict', 0.3, 0.01],  // dn.c_6_conflict
                            ['harmony',  0.1, 0.02],  // dn.c_6_harmony
                        ],
                    }
                },
                {
                    task_name: 'admc_decision_rules',
                    custom_task_settings: {
                        dr_items: [
                            {
                                id: "dr1",
                                correct_answers: ["C"],
                                table_numbers: [
                                    [5, 4, 2, 1],
                                    [5, 5, 3, 3],
                                    [5, 2, 4, 4],
                                    [1, 5, 5, 3],
                                    [4, 5, 1, 1],
                                ],
                                problem_description: `Brian selects the TV with the highest number of ratings greater than "Medium".`,
                                question: `Which <b><u>one</u></b> of the presented TVs would Brian prefer?`,
                            },
                            {
                                id: "dr2",
                                correct_answers: ["D"],
                                table_numbers: [
                                    [2, 5, 5, 5],
                                    [5, 4, 4, 5],
                                    [5, 3, 2, 5],
                                    [3, 5, 2, 2],
                                    [4, 4, 4, 5],
                                ],
                                problem_description: `Sally first selects the TVs with the best Sound Quality. From the selected TVs, she then selects the best on Picture Quality. Then, if there is still more than one left to choose from, she selects the one best on Programming Options.`,
                                question: `Which <b><u>one</u></b> of the presented TVs would Sally prefer?`,
                            },
                            {
                                id: "dr3",
                                correct_answers: ["C"],
                                table_numbers: [
                                    [3, 1, 2, 5],
                                    [5, 5, 3, 2],
                                    [4, 3, 3, 3],
                                    [5, 5, 5, 4],
                                    [2, 5, 4, 4],
                                ],
                                problem_description: `Pat doesn't want to read through the entire table. He decides to read the table row by row until he finds the very first TV that has no ratings below "Medium." He will just choose that TV.`,
                                question: `Which <b><u>one</u></b> of the presented TVs would Pat prefer?`,
                            },
                            {
                                id: "dr4",
                                correct_answers: ["None"],
                                table_numbers: [
                                    [3, 5, 5, 1],
                                    [1, 2, 1, 2],
                                    [5, 5, 4, 4],
                                    [5, 3, 4, 2],
                                    [4, 5, 2, 2],
                                ],
                                problem_description: `LaToya only wants a TV that got a "Very High" rating on Reliability of Brand.`,
                                question: `Which <b><u>one</u></b> of the presented TVs would LaToya prefer?`,
                            },
                            {
                                id: "dr5",
                                correct_answers: ["A"],
                                table_numbers: [
                                    [5, 5, 5, 3],
                                    [3, 5, 4, 5],
                                    [5, 2, 2, 4],
                                    [5, 1, 2, 5],
                                    [4, 2, 4, 5],
                                ],
                                problem_description: `From the TVs with the best available Picture Quality, Tricia selects the TVs with the lowest number of ratings below "Medium." If there is more than one TV left to choose from, she then picks the one that has the best rating on "Reliability of Brand."`,
                                question: `Which <b><u>one</u></b> of the presented TVs would Tricia prefer?`,
                            },
                            {
                                id: "dr8",

                                table_numbers: [

                            {

                                    [3, 3, 3, 3],
                                ],
                                problem_description: `Tyrone wants a TV that either has a "Very High" rating for Programming Options, or one that scores at least "Medium" on every feature.`,
                                question: `Which <b><u>three</u></b> of the presented TVs would Tyrone prefer?`,
                            },
                        ]
                    }
                }
            ]),
            media_basepath: 'https://cdn.jsdelivr.net/gh/nikbpetrov/FPT-Battery@main/assets/',
        };

        const fpt_battery = initFPTBattery(config);
        fpt_battery.task_registry.bayesian_update = TrimmedBayesianUpdate;
        fpt_battery.task_registry.denominator_neglect = FilteredDenominatorNeglect;
        fpt_battery.task_registry.time_series = FilteredTimeSeries;
        fpt_battery.run();
</script>
</html>
